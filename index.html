<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Accelerated Neural System Identification via Reduced-Order Modeling">
    <meta name="theme-color" content="#071a35">
    <title>Accelerated Neural System Identification via Reduced-Order Modeling</title>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
      :root {
        --navy: #071a35;
        --blue: #1459b8;
        --teal: #067f8a;
        --ink: #14243c;
        --muted: #58687a;
        --paper: #f8fafc;
        --line: #d8e0ea;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.62 Georgia, 'Times New Roman', serif; }
      a { color: var(--blue); }
      button { font: inherit; }
      .site-header { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgb(255 255 255 / 18%); background: var(--navy); }
      .bar { display: flex; width: min(1120px, calc(100% - 36px)); margin: auto; }
      .tab { padding: 15px 17px; border: 0; border-bottom: 3px solid transparent; color: #cbd8e9; background: transparent; cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .91rem; }
      .tab[aria-selected='true'] { border-color: #73d8d4; color: white; font-weight: 700; }
      .view { display: none; }
      .view.active { display: block; }

      #readme-view { width: min(930px, calc(100% - 36px)); margin: 54px auto 80px; }
      #readme { min-height: 50vh; }
      #readme h1 { margin: 0 0 8px; color: var(--navy); font-size: clamp(2rem, 5vw, 3.45rem); line-height: 1.15; letter-spacing: -.025em; }
      #readme h2 { margin: 50px 0 15px; padding-bottom: 8px; border-bottom: 1px solid var(--line); color: var(--navy); font-size: clamp(1.35rem, 3vw, 1.85rem); line-height: 1.25; }
      #readme p { margin: 15px 0; }
      #readme ul { padding-left: 26px; }
      #readme li { margin: 4px 0; }
      #readme li a { text-underline-offset: 3px; }
      #readme mjx-container[display='true'] { overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
      .loading { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; }

      #figures-view { width: min(1120px, calc(100% - 36px)); margin: 46px auto 80px; }
      .directory-title { margin: 0 0 24px; color: var(--navy); font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.15; }
      .directory { border-top: 1px solid var(--line); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: .92rem; }
      .folder { border-bottom: 1px solid var(--line); }
      .folder summary { padding: 13px 10px; cursor: pointer; color: var(--navy); font-weight: 700; }
      .folder summary::marker { color: var(--teal); }
      .file-list { margin: 0; padding: 0 0 10px 34px; list-style: none; }
      .file-list li { margin: 2px 0; }
      .file-button { width: 100%; padding: 7px 8px; border: 0; border-radius: 3px; color: var(--blue); background: transparent; text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
      .file-button:hover, .file-button:focus-visible { background: #e8f1fd; color: #073d88; }

      dialog { width: 100vw; max-width: none; height: 100vh; max-height: none; margin: 0; padding: 0; border: 0; background: #020917; color: white; }
      dialog::backdrop { background: #020917; }
      .viewer { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
      .viewer-media { display: grid; min-height: 0; place-items: center; padding: 22px; }
      .viewer-media img { max-width: 100%; max-height: 100%; object-fit: contain; }
      .viewer-caption { display: flex; align-items: center; gap: 18px; min-height: 68px; padding: 15px max(96px, calc((100vw - 1120px) / 2)) 15px max(22px, calc((100vw - 1120px) / 2)); background: #071a35; font-family: ui-sans-serif, system-ui, sans-serif; }
      .viewer-caption p { flex: 1; margin: 0; color: #d9e5f5; }
      .close { position: fixed; top: 15px; right: 17px; z-index: 1; padding: 8px 13px; border: 1px solid #8398b7; border-radius: 4px; color: white; background: #071a35; cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; }
      .close:hover, .close:focus-visible { background: #173a6d; }
      @media (max-width: 600px) {
        #readme-view { margin-top: 36px; }
        #readme { font-size: .98rem; }
        #readme ul { padding-left: 21px; }
        .viewer-caption { align-items: start; flex-direction: column; gap: 5px; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="bar" aria-label="Site sections">
        <button class="tab" type="button" data-view="readme-view" aria-selected="true">README</button>
        <button class="tab" type="button" data-view="figures-view" aria-selected="false">Figures</button>
      </nav>
    </header>

    <main>
      <section class="view active" id="readme-view" aria-label="README document">
        <article id="readme"><p class="loading">Loading README…</p></article>
      </section>
      <section class="view" id="figures-view" aria-label="Figures directory">
        <h1 class="directory-title">Figures</h1>
        <div class="directory" id="directory"></div>
      </section>
    </main>

    <dialog id="figure-viewer" aria-label="Figure viewer">
      <div class="viewer">
        <button class="close" type="button" id="close-viewer">Close</button>
        <div class="viewer-caption"><p id="viewer-caption">Caption placeholder.</p></div>
        <div class="viewer-media"><img id="viewer-image" alt=""></div>
      </div>
    </dialog>

    <script>
      window.addEventListener('load', () => {
      const figures = [
        { name: 'Animations', files: [
          '1d_allen_cahn.gif', '1d_rom_mode_contributions.gif', '1d_rom_reduced_state.gif',
          'Allen-Cahn_trajectory.gif', 'Cahn-Hilliard_Trajectory.gif', 'Learned_Allen-Cahn_trajectory.gif', 'Reaction-Diffusion_trajectory.gif'
        ]},
        { name: 'Images', folders: [
          { name: '1D_allen-cahn_spatial_modes', files: ['1d_ac_mode_1.png', '1d_ac_mode_2.png', '1d_ac_mode_3.png'] },
          { name: '2D_Allen-Cahn_Spatial_Modes', files: ['rom_spatial_mode_1.png', 'rom_spatial_mode_2.png', 'rom_spatial_mode_3.png', 'rom_spatial_mode_4.png', 'rom_spatial_mode_5.png'] },
          { name: 'Cahn-Hilliard_Spatial_Modes', files: ['rom_spatial_mode_1.png', 'rom_spatial_mode_2.png', 'rom_spatial_mode_3.png', 'rom_spatial_mode_4.png', 'rom_spatial_mode_5.png'] },
          { name: 'Nonlinearities', files: ['ac_nonlinearity.png', 'rd_nonlinearity.png'] },
          { name: 'Poster_figures', files: ['FOM_vs_ROM_speedup.png', 'curve_fit_speedup.png', 'learned_function_AC.png'] },
          { name: 'Reaction-diffusion_spatial_modes', files: ['rom_spatial_mode_1.png', 'rom_spatial_mode_2.png', 'rom_spatial_mode_3.png', 'rom_spatial_mode_4.png', 'rom_spatial_mode_5.png'] }
        ]}
      ];
      // Replace the placeholder text below with the caption for each figure.
      const captions = {
        'Figures/Animations/1d_allen_cahn.gif': '1-dimensional Allen-Cahn trajectory.',
        'Figures/Animations/1d_rom_mode_contributions.gif': 'Scaled reduced basis elements whose sum forms the projection of a ROM into the full space.',
        'Figures/Animations/1d_rom_reduced_state.gif': 'Reduced Allen-Cahn trajectory.',
        'Figures/Animations/Allen-Cahn_trajectory.gif': '2D Allen-Cahn trajectory. Neither component is learned. The ROM is a POD Galerkin / DEIM ROM.',
        'Figures/Animations/Cahn-Hilliard_Trajectory.gif': '2D Cahn-Hilliard trajectory. The ROM is a Petrov-Galerkin / ECSW ROM.',
        'Figures/Animations/Learned_Allen-Cahn_trajectory.gif': 'True vs. Learned Allen Cahn Trajectories. On the left is the target, full order model. On the right is a ROM, but the hyperreduced nonlinearity is neural. This neural network was itself trained on a ROM. The training process took about 10 minutes of CPU time; similar training on a FOM took 5 hours.',
        'Figures/Animations/Reaction-Diffusion_trajectory.gif': '2D reaction-diffusion trajectory; the ROM is a POD-Galerkin / DEIM ROM; DEIM points were evenly split between forcing functions.',
        'Figures/Images/1D_allen-cahn_spatial_modes/1d_ac_mode_1.png': '',
        'Figures/Images/1D_allen-cahn_spatial_modes/1d_ac_mode_2.png': '',
        'Figures/Images/1D_allen-cahn_spatial_modes/1d_ac_mode_3.png': '',
        'Figures/Images/2D_Allen-Cahn_Spatial_Modes/rom_spatial_mode_1.png': '',
        'Figures/Images/2D_Allen-Cahn_Spatial_Modes/rom_spatial_mode_2.png': '',
        'Figures/Images/2D_Allen-Cahn_Spatial_Modes/rom_spatial_mode_3.png': '',
        'Figures/Images/2D_Allen-Cahn_Spatial_Modes/rom_spatial_mode_4.png': '',
        'Figures/Images/2D_Allen-Cahn_Spatial_Modes/rom_spatial_mode_5.png': '',
        'Figures/Images/Cahn-Hilliard_Spatial_Modes/rom_spatial_mode_1.png': '',
        'Figures/Images/Cahn-Hilliard_Spatial_Modes/rom_spatial_mode_2.png': '',
        'Figures/Images/Cahn-Hilliard_Spatial_Modes/rom_spatial_mode_3.png': '',
        'Figures/Images/Cahn-Hilliard_Spatial_Modes/rom_spatial_mode_4.png': '',
        'Figures/Images/Cahn-Hilliard_Spatial_Modes/rom_spatial_mode_5.png': '',
        'Figures/Images/Nonlinearities/ac_nonlinearity.png': 'Allen-Cahn and Cahn-Hilliard free energy derivative term.',
        'Figures/Images/Nonlinearities/rd_nonlinearity.png': 'Forcing function on second component of the reaction-diffusion equation: s2(v1,v2)=10(v1-v2).',
        'Figures/Images/Poster_figures/FOM_vs_ROM_speedup.png': '',
        'Figures/Images/Poster_figures/curve_fit_speedup.png': 'FOM/ROM relative speedup per-optimization step (forward pass + loss + adjoint + parameter update) with N. Calibrated on the 2 dimensional Allen-Cahn equation. ',
        'Figures/Images/Poster_figures/learned_function_AC.png': 'True vs. Learned Allen Cahn Nonlinearities. The neural nonlinearity was trained on a ROM. The training process took about 10 minutes of CPU time; similar training on a FOM took 5 hours.',
        'Figures/Images/Reaction-diffusion_spatial_modes/rom_spatial_mode_1.png': '',
        'Figures/Images/Reaction-diffusion_spatial_modes/rom_spatial_mode_2.png': '',
        'Figures/Images/Reaction-diffusion_spatial_modes/rom_spatial_mode_3.png': '',
        'Figures/Images/Reaction-diffusion_spatial_modes/rom_spatial_mode_4.png': '',
        'Figures/Images/Reaction-diffusion_spatial_modes/rom_spatial_mode_5.png': '',
      };
      const readme = document.querySelector('#readme');
      const directory = document.querySelector('#directory');
      const dialog = document.querySelector('#figure-viewer');
      const image = document.querySelector('#viewer-image');
      const caption = document.querySelector('#viewer-caption');

      function pathButton(path, filename) {
        const button = document.createElement('button');
        button.className = 'file-button';
        button.type = 'button';
        button.textContent = filename;
        button.addEventListener('click', () => openFigure(path));
        return button;
      }
      function fileList(base, files) {
        const list = document.createElement('ul');
        list.className = 'file-list';
        files.forEach((file) => {
          const item = document.createElement('li');
          item.append(pathButton(`${base}/${file}`, file));
          list.append(item);
        });
        return list;
      }
      function folder(name, content, id) {
        const node = document.createElement('details');
        node.className = 'folder';
        if (id) node.id = `folder-${id}`;
        const summary = document.createElement('summary');
        summary.textContent = `${name}/`;
        node.append(summary, content);
        return node;
      }
      function buildDirectory() {
        figures.forEach((group) => {
          const base = `Figures/${group.name}`;
          const content = document.createElement('div');
          if (group.files) content.append(fileList(base, group.files));
          if (group.folders) group.folders.forEach((subfolder) => content.append(folder(subfolder.name, fileList(`${base}/${subfolder.name}`, subfolder.files), `${group.name}/${subfolder.name}`)));
          directory.append(folder(group.name, content, group.name));
        });
      }
      function setView(id) {
        document.querySelectorAll('.view').forEach((view) => view.classList.toggle('active', view.id === id));
        document.querySelectorAll('.tab').forEach((tab) => tab.setAttribute('aria-selected', String(tab.dataset.view === id)));
      }
      function openFigure(path) {
        setView('figures-view');
        image.src = path;
        image.alt = path.split('/').pop();
        caption.textContent = typeof captions[path] === 'string' ? captions[path] : 'Caption placeholder.';
        if (!dialog.open) dialog.showModal();
      }
      function applyHash() {
        const hash = decodeURIComponent(location.hash.slice(1));
        if (hash.startsWith('figure=')) openFigure(hash.slice(7));
        if (hash.startsWith('folder=')) {
          setView('figures-view');
          const folderNode = document.querySelector(`#folder-${CSS.escape(hash.slice(7).replace('Figures/', ''))}`);
          if (folderNode) { folderNode.open = true; folderNode.scrollIntoView({ block: 'start' }); }
        }
        if (hash === 'figures') setView('figures-view');
      }
      document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', () => {
        setView(tab.dataset.view);
        history.replaceState(null, '', tab.dataset.view === 'figures-view' ? '#figures' : location.pathname);
      }));
      document.querySelector('#close-viewer').addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
      buildDirectory();
      window.addEventListener('hashchange', applyHash);
      fetch('README.md')
        .then((response) => { if (!response.ok) throw new Error('README could not be loaded.'); return response.text(); })
        .then((markdown) => {
          readme.innerHTML = marked.parse(markdown);
          return MathJax.startup.promise.then(() => MathJax.typesetPromise([readme]));
        })
        .catch((error) => { readme.innerHTML = `<p class="loading">${error.message}</p>`; });
      applyHash();
      });
    </script>
  </body>
</html>
